<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Karan Panda</title>
  <desc id="d">Software engineer in Mumbai. Building systems that scale.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f2efe8" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="70%" r="55%">
      <stop offset="0" stop-color="#32f438" stop-opacity=".20"/>
      <stop offset="1" stop-color="#32f438" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32f438" stop-opacity="0"/>
      <stop offset=".5" stop-color="#32f438" stop-opacity=".07"/>
      <stop offset="1" stop-color="#32f438" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="400" rx="20"/></clipPath>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .scan { animation: scan 7s linear infinite; }
      .pulse { animation: pulse 2.4s ease-out infinite; transform-origin: 1076px 72px; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes scan { from { transform: translateY(-160px); } to { transform: translateY(420px); } }
      @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(3); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .scan, .pulse { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="#0b0b0a"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>
    <rect class="scan" y="0" width="1200" height="140" fill="url(#scan)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="398.5" rx="19.25" fill="none" stroke="#2a2925" stroke-width="1.5"/>

  <!-- K/P mark (same geometry as the portfolio) -->
  <g transform="translate(72 52) scale(1.25)" fill="none" stroke-width="5.5">
    <path d="M14.6 18.2 L23.87 35.8" stroke="#f2efe8"/>
    <path d="M7 27.6 L27.5 2.5" stroke="#32f438"/>
    <path d="M7 7 V37" stroke="#f2efe8"/>
    <path d="M34 37 V9.75 H41.25 A7.25 7.25 0 0 1 41.25 24.25 H34" stroke="#f2efe8"/>
  </g>

  <!-- status -->
  <circle class="pulse" cx="1076" cy="72" r="7" fill="#32f438"/>
  <circle cx="1076" cy="72" r="7" fill="#32f438"/>
  <text x="1096" y="80" class="mono" font-size="22" fill="#bdb9b0" letter-spacing="1">online</text>

  <text x="72" y="236" class="sans" font-size="96" font-weight="600" letter-spacing="-3" fill="#f2efe8">Karan Panda</text>
  <text x="76" y="308" class="mono" font-size="34" fill="#9b988f"><tspan fill="#32f438">$</tspan> building systems that scale<tspan class="cursor" fill="#32f438" dx="6">▍</tspan></text>
</svg>
